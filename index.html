<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#102b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Frog Hop</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c2630;font-family:-apple-system,BlinkMacSystemFont,"Avenir Next",system-ui,sans-serif;touch-action:none}
canvas{width:100%;height:100%;display:block}
#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;padding:12px 14px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.hudbox{min-width:78px;padding:8px 10px;border-radius:16px;background:rgba(7,28,35,.68);border:1.5px solid rgba(255,255,255,.22);box-shadow:0 7px 20px rgba(0,0,0,.18);color:#fff;text-align:center;backdrop-filter:blur(6px)}
.hudlabel{display:block;font-size:9px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase;opacity:.72}
.hudnum{display:block;font-size:23px;line-height:24px;font-weight:900}
#centerScore{position:absolute;left:50%;transform:translateX(-50%);top:9px;text-align:center;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.3)}
#centerScore .num{font-size:37px;line-height:40px;font-weight:950}
#centerScore .label{font-size:9px;letter-spacing:2.2px;font-weight:900;opacity:.78}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(5,18,24,.36);z-index:10}
.card{width:min(88vw,390px);max-height:78vh;overflow:auto;padding:31px 24px 27px;border:2px solid rgba(255,239,170,.68);border-radius:30px;background:linear-gradient(180deg,rgba(13,50,56,.97),rgba(7,31,39,.98));box-shadow:0 24px 70px rgba(0,0,0,.4);text-align:center;color:#fff}
.logo{font-size:clamp(39px,11vw,58px);line-height:1;font-weight:950;letter-spacing:1px;color:#c8f86b;text-shadow:0 4px 0 #315b2c;margin:0 0 8px}
.subtitle{font-size:17px;line-height:1.4;color:#ffe7a3;margin:0 0 22px;font-weight:700}
button{appearance:none;border:0;font:inherit;font-weight:900;font-size:21px;letter-spacing:.5px;border-radius:17px;padding:14px 38px;background:linear-gradient(#b6f65b,#75c932);color:#17341d;box-shadow:0 6px 0 #4f8b27,0 10px 22px rgba(0,0,0,.22)}
button:active{transform:translateY(5px);box-shadow:0 1px 0 #4f8b27}
.small{margin-top:18px;color:#d7e6e0;font-size:13px;line-height:1.45}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="hudbox"><span class="hudlabel">Best</span><span class="hudnum" id="best">0</span></div>
  <div id="centerScore"><div class="num" id="score">0</div><div class="label">SCORE</div></div>
  <div class="hudbox"><span class="hudlabel">Fireflies</span><span class="hudnum" id="fireflyCount">0</span></div>
</div>
<div id="overlay">
  <div class="card">
    <div class="logo">FROG HOP</div>
    <p class="subtitle" id="msg">Leap through the snakes and survive the swamp!</p>
    <button id="btn">PLAY</button>
    <div class="small">Tap anywhere to hop<br>Your best score saves automatically</div>
  </div>
</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),fireflyEl=document.getElementById('fireflyCount');
let W=0,H=0,dpr=1,game=null,last=0;

// Celebration effects for scores 10, 20, 30, ...
let confetti=[];
let celebration=0;
let celebrationText='';
let lastCelebratedScore=0;

function celebrate(score){
  celebration=75;
  celebrationText=String(score);
  confetti=[];
  for(let i=0;i<70;i++){
    const a=Math.random()*Math.PI*2;
    const speed=2.5+Math.random()*5.5;
    confetti.push({
      x:W*.5+(Math.random()-.5)*80,
      y:H*.28+(Math.random()-.5)*30,
      vx:Math.cos(a)*speed,
      vy:Math.sin(a)*speed-2,
      r:2+Math.random()*3,
      rot:Math.random()*Math.PI,
      vr:(Math.random()-.5)*.35,
      life:55+Math.random()*35,
      shape:Math.random()<.55?'rect':'circle'
    });
  }
}

function updateCelebration(dt){
  if(celebration>0) celebration-=dt;
  for(const c of confetti){
    c.x+=c.vx*dt;
    c.y+=c.vy*dt;
    c.vy+=.12*dt;
    c.vx*=.992;
    c.rot+=c.vr*dt;
    c.life-=dt;
  }
  confetti=confetti.filter(c=>c.life>0 && c.y<H+30);
}

function drawCelebration(){
  if(!confetti.length && celebration<=0)return;
  ctx.save();
  for(const p of confetti){
    ctx.globalAlpha=Math.min(1,p.life/18);
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle=['#ffcf4a','#ff6b6b','#62d7ff','#9bea63','#d28cff','#ffffff'][Math.floor(Math.random()*6)];
    if(p.shape==='rect') ctx.fillRect(-p.r,-p.r*.55,p.r*2,p.r*1.1);
    else { ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill(); }
    ctx.rotate(-p.rot);
    ctx.translate(-p.x,-p.y);
  }
  ctx.restore();

  if(celebration>0){
    ctx.save();
    const pulse=1+Math.sin((75-celebration)*.35)*.06;
    ctx.translate(W*.5,H*.22);
    ctx.scale(pulse,pulse);
    ctx.globalAlpha=Math.min(1,celebration/18);
    ctx.textAlign='center';
    ctx.font='900 42px system-ui, sans-serif';
    ctx.lineWidth=7;
    ctx.strokeStyle='rgba(20,55,50,.35)';
    ctx.strokeText(celebrationText+'!',0,0);
    ctx.fillStyle='#fff8a8';
    ctx.fillText(celebrationText+'!',0,0);
    ctx.font='700 14px system-ui, sans-serif';
    ctx.fillStyle='#ffffff';
    ctx.fillText('NICE!',0,25);
    ctx.restore();
  }
}

const BEST_KEY='frogHopBestV6';
const best=()=>Number(localStorage.getItem(BEST_KEY)||0);
bestEl.textContent=best();

function size(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  c.width=Math.round(W*dpr); c.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',size); size();

const overlay=document.getElementById('overlay'),btn=document.getElementById('btn'),msg=document.getElementById('msg');

function start(){
  confetti=[]; celebration=0; celebrationText=''; lastCelebratedScore=0;
  game={
    run:true,score:0,time:0,speed:3.8,next:0,
    fireflies:[],fireflyCount:0,fireflyTimer:0,
    targetCenter:H*.46,
    f:{x:W*.25,y:H*.46,vy:0,rot:0,blink:0},
    pipes:[]
  };
  scoreEl.textContent='0';
  fireflyEl.textContent='0';
  overlay.classList.add('hidden');
  jump();
}
function over(){
  if(!game||!game.run)return;
  game.run=false;
  const b=Math.max(best(),game.score);
  localStorage.setItem(BEST_KEY,b);
  bestEl.textContent=b;
  msg.innerHTML=`You scored <b>${game.score}</b><br>Best: <b>${b}</b>`;
  btn.textContent='PLAY AGAIN';
  overlay.classList.remove('hidden');
}
function jump(){
  if(!game?.run)return;
  game.f.vy=-7.85;
  game.f.rot=-.45;
}
btn.onclick=e=>{e.stopPropagation();start()};
addEventListener('pointerdown',e=>{if(e.target===btn)return;if(game?.run)jump();else start()});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();game?.run?jump():start()}});

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}

function bg(){
  const t=game?.time||0;
  const cycle=(t/3600)%1; // 60 seconds per full day/night cycle at 60fps
  const sun=Math.sin(cycle*Math.PI*2);
  const daylight=Math.max(0,(sun+0.18)/1.18);
  const night=1-daylight;

  // Layered sky that smoothly cycles through day, sunset, night and sunrise.
  const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
  const dayTop=[75,166,214], dayMid=[151,211,196], dayLow=[239,201,132];
  const nightTop=[7,20,48], nightMid=[23,55,82], nightLow=[39,67,78];
  const cTop=mix(nightTop,dayTop,daylight), cMid=mix(nightMid,dayMid,daylight), cLow=mix(nightLow,dayLow,daylight);
  const rgb=v=>`rgb(${v[0]},${v[1]},${v[2]})`;
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,rgb(cTop));
  sky.addColorStop(.48,rgb(cMid));
  sky.addColorStop(1,rgb(cLow));
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // Tiny stars.
  ctx.fillStyle=`rgba(255,255,225,${0.08+night*.65})`;
  for(let i=0;i<28;i++){
    const x=(i*97)%W, y=35+(i*53)%(H*.38);
    const r=(i%3===0)?1.3:.8;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }

  // Sun / moon travel across the sky.
  const celestialX=W*.18 + cycle*W*.64;
  const celestialY=H*(.17 + Math.abs(Math.sin(cycle*Math.PI))*-.015);
  if(daylight>.12){
    const glow=ctx.createRadialGradient(celestialX,celestialY,4,celestialX,celestialY,125);
    glow.addColorStop(0,`rgba(255,245,180,${.95*daylight})`);
    glow.addColorStop(.22,`rgba(255,215,105,${.28*daylight})`);
    glow.addColorStop(1,'rgba(255,210,125,0)');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(celestialX,celestialY,125,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(255,239,166,${.9*daylight})`;
    ctx.beginPath();ctx.arc(celestialX,celestialY,29,0,Math.PI*2);ctx.fill();
  }
  if(night>.18){
    const mx=W*.18 + ((cycle+.5)%1)*W*.64;
    const my=H*.17;
    ctx.fillStyle=`rgba(245,246,213,${.82*night})`;
    ctx.beginPath();ctx.arc(mx,my,25,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=rgb(cTop);
    ctx.beginPath();ctx.arc(mx+9,my-6,23,0,Math.PI*2);ctx.fill();
  }

  // Far hills.
  ctx.fillStyle='#315863';
  ctx.beginPath();ctx.moveTo(0,H*.59);
  for(let i=0;i<=12;i++){
    const px=i*W/12;
    const peak=H*(.48+(i%3)*.025);
    ctx.quadraticCurveTo(px+W/24,H*.42,px+W/12,peak);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();

  // Layered swamp trees.
  for(let layer=0;layer<2;layer++){
    for(let i=0;i<11;i++){
      let px=(i*109+layer*47-t*(.10+layer*.05))%(W+130);if(px<0)px+=W+130;
      const base=H*(.72+layer*.025);
      const trunk=55+(i%3)*16;
      ctx.fillStyle=layer?'#16444b':'#1d5056';
      ctx.fillRect(px-7,base-trunk,14,trunk);
      for(let j=0;j<5;j++){
        ctx.beginPath();
        ctx.arc(px+(j%2?17:-17),base-trunk-16-j*12,30-j*2.2,0,Math.PI*2);
        ctx.fill();
      }
    }
  }

  // Foreground reeds with highlights.
  for(let i=0;i<28;i++){
    let px=(i*59-t*.42)%(W+90);if(px<0)px+=W+90;
    const h=85+(i%5)*20;
    ctx.strokeStyle=i%2?'#1e6b55':'#2b805e';
    ctx.lineWidth=5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(px,H*.75);ctx.quadraticCurveTo(px-7,H*.75-h*.52,px+8,H*.75-h);ctx.stroke();
    ctx.strokeStyle='rgba(111,190,112,.28)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(px+3,H*.75);ctx.quadraticCurveTo(px,H*.75-h*.48,px+10,H*.75-h*.92);ctx.stroke();
  }

  // Water.
  const water=ctx.createLinearGradient(0,H*.68,0,H);
  water.addColorStop(0,'#21818a');water.addColorStop(.45,'#126574');water.addColorStop(1,'#072f42');
  ctx.fillStyle=water;ctx.fillRect(0,H*.68,W,H*.32);

  // Water ripples.
  for(let i=0;i<16;i++){
    let px=(i*119-t*(1.1+i%2*.35))%(W+130);if(px<0)px+=W+130;
    const py=H*.73+(i%6)*45;
    ctx.strokeStyle='rgba(159,231,211,.38)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(px,py);ctx.quadraticCurveTo(px+28,py-4,px+57,py);ctx.stroke();
  }

  // Lily pads.
  for(let i=0;i<9;i++){
    let px=(i*181-t*.65)%(W+90);if(px<0)px+=W+90;
    const py=H*.76+(i%3)*57;
    ctx.fillStyle='#4fa75a';ctx.strokeStyle='#286b45';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.ellipse(px,py,31,12,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#2c6d45';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+18,py-9);ctx.stroke();
  }
}

function snake(x,edge,length,top,phase=0){
  const snakeStage=Math.floor((game.score||0)/10)%6;
  const snakePalettes=[
    ['#4f9f45','#2b6935','#d7f06b'],
    ['#4f6fd1','#263c8a','#b9d5ff'],
    ['#b35bc5','#6d2f7d','#f0b6ff'],
    ['#d06a3a','#7f321e','#ffd08a'],
    ['#d1a43a','#785d18','#fff0a2'],
    ['#39a8a0','#17625f','#a7fff1']
  ];
  const [snakeMain,snakeDark,snakeLight]=snakePalettes[snakeStage];


  ctx.save();
  const dir=top?-1:1;
  const w=22;
  const amp=24;
  const bodyPath=()=>{
    ctx.beginPath();
    ctx.moveTo(x,edge);
    ctx.bezierCurveTo(x+amp,edge+dir*48,x-amp,edge+dir*104,x,edge+dir*158);
    ctx.bezierCurveTo(x+amp,edge+dir*214,x-amp,edge+dir*275,x+Math.sin(phase)*8,edge+dir*length);
  };

  // Soft shadow.
  ctx.save();ctx.translate(5,6);
  ctx.strokeStyle='rgba(0,0,0,.23)';ctx.lineWidth=w+8;ctx.lineCap='round';bodyPath();ctx.stroke();ctx.restore();

  // Main snake body with highlight.
  const grad=ctx.createLinearGradient(x-18,0,x+18,0);
  grad.addColorStop(0,snakeDark);
  grad.addColorStop(.24,snakeMain);
  grad.addColorStop(.52,snakeLight);
  grad.addColorStop(.78,snakeMain);
  grad.addColorStop(1,snakeDark);
  ctx.strokeStyle=grad;ctx.lineWidth=w;ctx.lineCap='round';bodyPath();ctx.stroke();

  // Bright dorsal highlight.
  ctx.strokeStyle=snakeLight;ctx.lineWidth=4;bodyPath();ctx.stroke();

  // Belly scales / pattern.
  for(let i=0;i<12;i++){
    const yy=edge+dir*(18+i*27);
    const xx=x+Math.sin(i*.9+phase)*amp*.45;
    ctx.fillStyle=i%2?'rgba(221,224,126,.72)':'rgba(239,230,143,.56)';
    ctx.beginPath();ctx.ellipse(xx,yy,5,7,dir*.12,0,Math.PI*2);ctx.fill();
  }

  // Head at the opening, angled into the gap.
  const hx=x,hy=edge+dir*2;
  ctx.fillStyle=snakeMain;ctx.strokeStyle=snakeDark;ctx.lineWidth=4;
  ctx.beginPath();ctx.ellipse(hx,hy+dir*11,30,24,0,0,Math.PI*2);ctx.fill();ctx.stroke();

  // Snout.
  ctx.fillStyle=snakeLight;ctx.beginPath();ctx.ellipse(hx,hy+dir*18,21,13,0,0,Math.PI*2);ctx.fill();ctx.stroke();

  // Eye stalks and eyes.
  for(const s of [-1,1]){
    ctx.fillStyle=snakeMain;ctx.beginPath();ctx.arc(hx+s*12,hy-dir*6,10,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#f8fff2';ctx.beginPath();ctx.arc(hx+s*12,hy-dir*7,6.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#15251a';ctx.beginPath();ctx.arc(hx+s*13,hy-dir*7,2.8,0,Math.PI*2);ctx.fill();
  }

  // Nostrils.
  ctx.fillStyle=snakeDark;
  ctx.beginPath();ctx.arc(hx-6,hy+dir*17,1.7,0,Math.PI*2);ctx.arc(hx+6,hy+dir*17,1.7,0,Math.PI*2);ctx.fill();

  // Mouth.
  ctx.strokeStyle='#173421';ctx.lineWidth=2.4;
  ctx.beginPath();ctx.moveTo(hx-11,hy+dir*22);ctx.quadraticCurveTo(hx,hy+dir*28,hx+11,hy+dir*22);ctx.stroke();

  // Forked tongue pointing into the gap.
  ctx.strokeStyle='#ef5b62';ctx.lineWidth=2.8;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(hx,hy+dir*27);ctx.lineTo(hx,hy+dir*41);
  ctx.moveTo(hx,hy+dir*39);ctx.lineTo(hx-6,hy+dir*46);
  ctx.moveTo(hx,hy+dir*39);ctx.lineTo(hx+6,hy+dir*46);
  ctx.stroke();

  ctx.restore();
}

function frog(){
  const f=game.f;
  ctx.save();
  ctx.translate(f.x,f.y);
  ctx.rotate(f.rot*.45);

  const rising=f.vy<0;
  const phase=game.time*.34;
  const kick=(Math.sin(phase)+1)/2;

  ctx.lineCap='round';ctx.lineJoin='round';

  // Ground shadow.
  ctx.fillStyle='rgba(3,24,29,.22)';
  ctx.beginPath();ctx.ellipse(0,25,31,6,0,0,Math.PI*2);ctx.fill();

  // BIG folded rear thigh, clearly visible behind the body.
  ctx.fillStyle='#4b9f3a';ctx.strokeStyle='#153d27';ctx.lineWidth=3.5;
  ctx.beginPath();
  ctx.ellipse(-15,10,19,14,-.35,0,Math.PI*2);
  ctx.fill();ctx.stroke();

  // Lower hind leg: tucked when falling, extends backward during a hop.
  const kneeX=-27-5*kick;
  const kneeY=17+5*kick;
  const ankleX=-39-10*(rising?kick:.2);
  const ankleY=20+11*(rising?kick:.2);
  ctx.strokeStyle='#347b36';ctx.lineWidth=8;
  ctx.beginPath();
  ctx.moveTo(-23,13);
  ctx.quadraticCurveTo(kneeX,kneeY,ankleX,ankleY);
  ctx.stroke();

  // Rear webbed foot.
  ctx.strokeStyle='#2a6d34';ctx.lineWidth=2.8;
  ctx.beginPath();
  ctx.moveTo(ankleX,ankleY);ctx.lineTo(ankleX-13,ankleY+1);
  ctx.moveTo(ankleX,ankleY);ctx.lineTo(ankleX-11,ankleY+6);
  ctx.moveTo(ankleX+1,ankleY);ctx.lineTo(ankleX-7,ankleY+10);
  ctx.stroke();

  // Main body.
  const body=ctx.createRadialGradient(-10,-10,2,2,5,38);
  body.addColorStop(0,'#d9fa79');body.addColorStop(.35,'#91df50');
  body.addColorStop(.75,'#4ca53a');body.addColorStop(1,'#2c7131');
  ctx.fillStyle=body;ctx.strokeStyle='#143c26';ctx.lineWidth=3.5;
  ctx.beginPath();ctx.ellipse(-3,1,32,21,-.05,0,Math.PI*2);ctx.fill();ctx.stroke();

  // Pale belly.
  ctx.fillStyle='#e1f0a4';
  ctx.beginPath();ctx.ellipse(8,8,20,10,-.12,0,Math.PI*2);ctx.fill();

  // Head.
  const head=ctx.createRadialGradient(17,-20,2,24,-10,26);
  head.addColorStop(0,'#a8ee60');head.addColorStop(.58,'#79d14b');head.addColorStop(1,'#438f36');
  ctx.fillStyle=head;
  ctx.beginPath();ctx.ellipse(24,-12,22,18,-.08,0,Math.PI*2);ctx.fill();ctx.stroke();

  // Eye bump and eye.
  ctx.fillStyle='#61b044';
  ctx.beginPath();ctx.ellipse(35,-26,7.5,7,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#f7fff0';ctx.beginPath();ctx.arc(37,-27,4.8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#17231b';ctx.beginPath();ctx.arc(38.5,-27,2.25,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(39.2,-27.8,.75,0,Math.PI*2);ctx.fill();

  // Face.
  ctx.fillStyle='#214a27';ctx.beginPath();ctx.arc(40,-10,1.2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#214a27';ctx.lineWidth=2.2;
  ctx.beginPath();ctx.moveTo(35,-5);ctx.quadraticCurveTo(42,-1,48,-6);ctx.stroke();
  ctx.strokeStyle='rgba(38,88,38,.48)';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.arc(24,-2,9,-.6,.85);ctx.stroke();

  // FRONT ARM — deliberately drawn on top so it cannot disappear into the body.
  const armKick=rising ? Math.sin(phase)*3 : 0;
  const elbowX=22, elbowY=10+armKick;
  const handX=30+3*kick, handY=18+armKick;
  ctx.strokeStyle='#367c36';ctx.lineWidth=6;
  ctx.beginPath();
  ctx.moveTo(15,4);
  ctx.quadraticCurveTo(elbowX,elbowY,handX,handY);
  ctx.stroke();

  // Front hand + three tiny toes.
  ctx.strokeStyle='#286934';ctx.lineWidth=2.3;
  ctx.beginPath();
  ctx.moveTo(handX,handY);ctx.lineTo(handX+8,handY-2);
  ctx.moveTo(handX,handY+1);ctx.lineTo(handX+8,handY+2);
  ctx.moveTo(handX-1,handY+2);ctx.lineTo(handX+6,handY+6);
  ctx.stroke();

  ctx.restore();
}function spawn(){
  // Difficulty ramps in two ways:
  // 1) the gap gradually narrows
  // 2) the gap centre can be higher OR lower on the screen.
  const gap=Math.max(128,188-game.score*1.45);

  const safeTop=Math.max(112,gap*.5+40);
  const safeBottom=Math.min(H*.66-gap*.5-28,H-120);

  // Wider vertical range as score rises, but always leave a playable route.
  const rangeBoost=Math.min(42,game.score*1.5);
  const minCenter=safeTop-rangeBoost;
  const maxCenter=safeBottom+rangeBoost;

  let center;
  if(game.score===0){
    center=H*.45;
  }else{
    const desired=minCenter+Math.random()*(maxCenter-minCenter);
    // Prevent brutal vertical jumps between consecutive obstacles.
    center=clamp(desired,game.targetCenter-85-rangeBoost*.25,game.targetCenter+85+rangeBoost*.25);
  }
  center=clamp(center,safeTop,safeBottom);
  game.targetCenter=center;

  game.pipes.push({
    x:W+95,w:58,g:center,gap,
    scored:false,phase:Math.random()*Math.PI*2
  });
}


function spawnFirefly(){
  if(!game || !game.run || game.fireflies.length) return;

  // Put the firefly inside the opening of an approaching snake pair.
  const target = game.pipes.find(p => p.x > game.f.x + 80 && p.x < W + 180);
  if(!target) return;

  const top = target.g - target.gap/2;
  const bottom = target.g + target.gap/2;
  const margin = 26;
  const usable = Math.max(8, bottom - top - margin*2);

  // Randomize both horizontal and vertical placement inside the opening.
  // Keep a safe margin from the snakes and occasionally bias the firefly
  // toward the upper or lower part of the gap instead of always centering it.
  const horizontalOffset = (Math.random() - 0.5) * Math.max(20, target.w * 0.8);
  let verticalRatio = Math.random();
  if(Math.random() < 0.5){
    verticalRatio = Math.random() < 0.5
      ? Math.random() * 0.35
      : 0.65 + Math.random() * 0.35;
  }

  game.fireflies.push({
    x: target.x + target.w/2 + horizontalOffset,
    baseY: top + margin + verticalRatio * usable,
    y: 0,
    phase: Math.random()*Math.PI*2,
    life: 0
  });
  game.fireflies[0].y = game.fireflies[0].baseY;
}

function updateFireflies(dt){
  if(!game || !game.run) return;

  game.fireflyTimer += dt;

  // The first firefly appears after roughly 3–5 seconds.
  if(game.fireflies.length===0 && game.fireflyTimer > 3 + Math.random()*2){
    spawnFirefly();
    game.fireflyTimer=0;
  }

  for(let i=game.fireflies.length-1;i>=0;i--){
    const f=game.fireflies[i];
    f.x -= game.speed*dt;
    f.life += dt;
    f.y = f.baseY + Math.sin(f.life*.12 + f.phase)*7;

    if(f.x < -35){
      game.fireflies.splice(i,1);
      continue;
    }

    const dx=f.x-game.f.x;
    const dy=f.y-game.f.y;
    if(dx*dx+dy*dy < 30*30){
      game.fireflyCount++;
      game.score++;
      scoreEl.textContent=game.score;
      fireflyEl.textContent=game.fireflyCount;
      game.fireflies.splice(i,1);

      if(game.fireflyCount % 10 === 0 && game.score!==lastCelebratedScore){
        lastCelebratedScore=game.score;
        celebrate(game.score);
      }
    }
  }
}

function drawFireflies(){
  if(!game) return;

  for(const f of game.fireflies){
    const pulse=1+Math.sin(f.life*.25+f.phase)*.18;
    const glow=22*pulse;

    ctx.save();
    ctx.globalCompositeOperation='lighter';

    const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,glow);
    g.addColorStop(0,'rgba(255,255,205,.98)');
    g.addColorStop(.3,'rgba(255,240,90,.62)');
    g.addColorStop(1,'rgba(255,220,50,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(f.x,f.y,glow,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle='#fff9a8';
    ctx.beginPath();
    ctx.arc(f.x,f.y,3.5*pulse,0,Math.PI*2);
    ctx.fill();

    // Tiny translucent wings.
    ctx.strokeStyle='rgba(255,255,225,.75)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.ellipse(f.x-4,f.y-2,4,2,-.4,0,Math.PI*2);
    ctx.ellipse(f.x+4,f.y-2,4,2,.4,0,Math.PI*2);
    ctx.stroke();

    ctx.restore();
  }
}

function draw(){
  bg();
  if(!game)return;
  for(const p of game.pipes){
    const length=Math.max(330,H*.66);
    snake(p.x,p.g-p.gap/2,length,true,p.phase);
    snake(p.x,p.g+p.gap/2,length,false,p.phase+1.2);
  }
  drawFireflies();
  frog();
  drawCelebration();
}

function loop(t){
  const dt=Math.min((t-last)/16.67,2);last=t;
  if(game?.run){
    game.time+=dt;
    updateCelebration(dt);
    game.f.vy+=.42*dt;
    game.f.y+=game.f.vy*dt;
    game.f.rot=clamp(game.f.rot+.038*dt,-.45,.95);
    game.speed=Math.min(6.6,3.8+game.score*.045);

    if(game.pipes.length===0 || game.pipes.at(-1).x<W-275)spawn();

    updateFireflies(dt);

    for(const p of game.pipes){
      p.x-=game.speed*dt;

      if(!p.scored && p.x+p.w<game.f.x){
        p.scored=true;
        game.score++;
        scoreEl.textContent=game.score;
        if(game.score>=10 && game.score%10===0 && game.score!==lastCelebratedScore){
          lastCelebratedScore=game.score;
          celebrate(game.score);
        }
      }

      // Small, forgiving frog hitbox.
      const fx=9,fy=10;
      const hitX=game.f.x+fx>p.x && game.f.x-fx<p.x+p.w;
      const gapTop=p.g-p.gap/2;
      const gapBottom=p.g+p.gap/2;
      const hitY=game.f.y-fy<gapTop || game.f.y+fy>gapBottom;
      if(hitX&&hitY){over();break}
    }

    game.pipes=game.pipes.filter(p=>p.x>-140);
    if(game.f.y<18 || game.f.y>H*.68-5)over();
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
