<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#102b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Frog Hop</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102b35;font-family:-apple-system,BlinkMacSystemFont,"Avenir Next",system-ui,sans-serif;touch-action:none}
canvas{width:100%;height:100%;display:block}
#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;padding:12px 14px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.hudbox{min-width:76px;padding:7px 10px;border-radius:15px;background:rgba(11,32,39,.72);border:1.5px solid rgba(255,255,255,.24);box-shadow:0 6px 18px rgba(0,0,0,.16);color:#fff;text-align:center}
.hudlabel{display:block;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:.72}
.hudnum{display:block;font-size:22px;line-height:22px;font-weight:900}
#centerScore{position:absolute;left:50%;transform:translateX(-50%);top:12px;text-align:center;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.28)}
#centerScore .num{font-size:34px;line-height:38px;font-weight:950}
#centerScore .label{font-size:9px;letter-spacing:2px;font-weight:900;opacity:.8}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(6,19,27,.42);z-index:10}
.card{width:min(88vw,390px);max-height:78vh;overflow:auto;padding:30px 24px 26px;border:2px solid rgba(255,239,170,.72);border-radius:30px;background:linear-gradient(180deg,rgba(17,51,56,.97),rgba(10,35,43,.97));box-shadow:0 24px 70px rgba(0,0,0,.38);text-align:center;color:#fff}
.logo{font-size:clamp(38px,11vw,56px);line-height:1;font-weight:950;letter-spacing:1px;color:#bdf45b;text-shadow:0 4px 0 #315b2c;margin:0 0 8px}
.subtitle{font-size:17px;line-height:1.4;color:#ffe7a3;margin:0 0 22px;font-weight:700}
button{appearance:none;border:0;font:inherit;font-weight:900;font-size:21px;letter-spacing:.5px;border-radius:17px;padding:14px 38px;background:linear-gradient(#a9ef4c,#79c934);color:#17341d;box-shadow:0 6px 0 #4f8b27,0 10px 22px rgba(0,0,0,.22)}
button:active{transform:translateY(5px);box-shadow:0 1px 0 #4f8b27}
.small{margin-top:18px;color:#d7e6e0;font-size:13px;line-height:1.45}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="hudbox"><span class="hudlabel">Best</span><span class="hudnum" id="best">0</span></div>
  <div id="centerScore"><div class="num" id="score">0</div><div class="label">SCORE</div></div>
  <div class="hudbox"><span class="hudlabel">Hop</span><span class="hudnum">🐸</span></div>
</div>
<div id="overlay">
  <div class="card">
    <div class="logo">FROG HOP</div>
    <p class="subtitle" id="msg">Leap through the snakes and survive the swamp!</p>
    <button id="btn">PLAY</button>
    <div class="small">Tap anywhere to hop<br>Your best score saves automatically</div>
  </div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
let W=0,H=0,dpr=1,game=null,last=0;
const BEST_KEY='frogHopBestV4';
const best=()=>Number(localStorage.getItem(BEST_KEY)||0);
bestEl.textContent=best();

function size(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  c.width=Math.round(W*dpr); c.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',size); size();
requestAnimationFrame(()=>draw());

const overlay=document.getElementById('overlay'),btn=document.getElementById('btn'),msg=document.getElementById('msg');

function start(){
  game={run:true,score:0,time:0,speed:3.75,next:0,
    f:{x:W*.25,y:H*.43,vy:0,rot:0,blink:0},
    pipes:[]};
  scoreEl.textContent='0';
  overlay.classList.add('hidden');
  jump();
}
function over(){
  if(!game||!game.run)return;
  game.run=false;
  const b=Math.max(best(),game.score);
  localStorage.setItem(BEST_KEY,b);
  bestEl.textContent=b;
  msg.innerHTML=`You scored <b>${game.score}</b><br>Best: <b>${b}</b>`;
  btn.textContent='PLAY AGAIN';
  overlay.classList.remove('hidden');
}
function jump(){
  if(!game?.run)return;
  game.f.vy=-8.45;
  game.f.rot=-.42;
}
btn.onclick=e=>{e.stopPropagation();start()};
addEventListener('pointerdown',e=>{if(e.target===btn)return;if(game?.run)jump();else start()});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();game?.run?jump():start()}});

function rr(px,py,w,h,r){
  ctx.beginPath();ctx.roundRect(px,py,w,h,r);ctx.fill();
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function bg(){
  const t=game?.time||0;
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#244e62');sky.addColorStop(.42,'#5d8f89');sky.addColorStop(.7,'#c5a36f');sky.addColorStop(1,'#0e4851');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // moon/sun glow
  const gx=W*.78, gy=H*.18;
  const glow=ctx.createRadialGradient(gx,gy,4,gx,gy,105);
  glow.addColorStop(0,'rgba(255,239,175,.95)');
  glow.addColorStop(.28,'rgba(255,220,132,.38)');
  glow.addColorStop(1,'rgba(255,220,132,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(gx,gy,105,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffe9a9';ctx.beginPath();ctx.arc(gx,gy,31,0,Math.PI*2);ctx.fill();

  // distant hills
  ctx.fillStyle='#315963';
  ctx.beginPath();ctx.moveTo(0,H*.58);
  for(let i=0;i<=10;i++){
    const px=i*W/10, py=H*(.49+((i*7)%3)*.035);
    ctx.quadraticCurveTo(px+W/20,H*.43,px+W/10,py);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();

  // tree silhouettes
  for(let i=0;i<9;i++){
    let px=(i*117-t*.18)%(W+150); if(px<0)px+=W+150;
    const base=H*.72, trunk=40+(i%3)*18;
    ctx.fillStyle=i%2?'#173f45':'#1c4b4b';
    ctx.fillRect(px-7,base-trunk,14,trunk);
    for(let j=0;j<4;j++){
      ctx.beginPath();ctx.arc(px+(j%2?16:-15),base-trunk-18-j*14,28-j*2,0,Math.PI*2);ctx.fill();
    }
  }

  // reeds
  for(let i=0;i<22;i++){
    let px=(i*71-t*.35)%(W+90); if(px<0)px+=W+90;
    ctx.strokeStyle=i%2?'#1c5a4d':'#2c7055';ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(px,H*.79);ctx.quadraticCurveTo(px-5,H*.63,px+8,H*.49);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px+5,H*.78);ctx.quadraticCurveTo(px+18,H*.65,px+13,H*.56);ctx.stroke();
  }

  // water
  const water=ctx.createLinearGradient(0,H*.69,0,H);
  water.addColorStop(0,'#23717a');water.addColorStop(1,'#0a3849');
  ctx.fillStyle=water;ctx.fillRect(0,H*.69,W,H*.31);
  for(let i=0;i<12;i++){
    let px=(i*131-t*1.3)%(W+100);if(px<0)px+=W+100;
    const py=H*.74+(i%5)*43;
    ctx.strokeStyle='rgba(147,218,196,.42)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(px,py);ctx.quadraticCurveTo(px+28,py-4,px+57,py);ctx.stroke();
  }

  // lily pads
  for(let i=0;i<8;i++){
    let px=(i*177-t*.7)%(W+80);if(px<0)px+=W+80;
    const py=H*.77+(i%3)*58;
    ctx.fillStyle='#4f9d58';ctx.beginPath();ctx.ellipse(px,py,27,10,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#2d6c42';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+15,py-8);ctx.stroke();
  }
}

function snake(px,py,h,top){
  ctx.save();ctx.translate(px,py);if(top)ctx.scale(1,-1);

  // shadow
  ctx.fillStyle='rgba(0,0,0,.18)';rr(-36,8,72,h,30);

  // body
  const body=ctx.createLinearGradient(-32,0,32,0);
  body.addColorStop(0,'#245c32');body.addColorStop(.5,'#72bb4f');body.addColorStop(1,'#285f34');
  ctx.fillStyle=body;ctx.strokeStyle='#153d27';ctx.lineWidth=4;
  rr(-31,0,62,h,28);ctx.stroke();

  // belly
  const belly=ctx.createLinearGradient(-12,0,12,0);
  belly.addColorStop(0,'#b99858');belly.addColorStop(.5,'#f0db8d');belly.addColorStop(1,'#b38b4b');
  ctx.fillStyle=belly;rr(-12,4,24,h-6,12);

  // scale pattern
  for(let yy=18;yy<h-12;yy+=22){
    ctx.fillStyle='rgba(255,255,255,.14)';
    ctx.beginPath();ctx.arc(-20,yy,3,0,Math.PI*2);ctx.arc(20,yy+9,3,0,Math.PI*2);ctx.fill();
  }

  // head
  ctx.fillStyle='#6fbe4d';ctx.strokeStyle='#153d27';ctx.lineWidth=4;
  ctx.beginPath();ctx.ellipse(0,h+2,43,31,0,0,Math.PI*2);ctx.fill();ctx.stroke();

  // eyes
  ctx.fillStyle='#f7e47d';ctx.beginPath();ctx.arc(-14,h-5,9,0,Math.PI*2);ctx.arc(14,h-5,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#152017';ctx.beginPath();ctx.arc(-12,h-5,4,0,Math.PI*2);ctx.arc(16,h-5,4,0,Math.PI*2);ctx.fill();

  // smile and tongue
  ctx.strokeStyle='#19301f';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,h+5,15,.1,Math.PI-.1);ctx.stroke();
  ctx.strokeStyle='#ef5c62';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(5,h+26);ctx.lineTo(5,h+47);ctx.stroke();
  ctx.beginPath();ctx.moveTo(5,h+43);ctx.lineTo(-1,h+49);ctx.moveTo(5,h+43);ctx.lineTo(11,h+49);ctx.stroke();
  ctx.restore();
}

function frog(){
  const f=game.f;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);

  // shadow
  ctx.fillStyle='rgba(5,28,31,.28)';ctx.beginPath();ctx.ellipse(0,30,27,8,0,0,Math.PI*2);ctx.fill();

  // rear legs
  ctx.fillStyle='#4b9b37';ctx.strokeStyle='#183c25';ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(-23,14,21,11,-.3,0,Math.PI*2);ctx.ellipse(23,14,21,11,.3,0,Math.PI*2);ctx.fill();ctx.stroke();

  // toes
  ctx.strokeStyle='#2b6330';ctx.lineWidth=3;ctx.lineCap='round';
  for(const s of [-1,1])for(let i=-1;i<=1;i++){
    const bx=s*29;ctx.beginPath();ctx.moveTo(bx,17);ctx.lineTo(bx+s*11,24+i*4);ctx.stroke();
  }

  // body
  const body=ctx.createLinearGradient(0,-20,0,25);
  body.addColorStop(0,'#b8f65d');body.addColorStop(.55,'#70cf43');body.addColorStop(1,'#3d9137');
  ctx.fillStyle=body;ctx.strokeStyle='#183c25';ctx.lineWidth=3.5;
  ctx.beginPath();ctx.ellipse(0,4,27,23,0,0,Math.PI*2);ctx.fill();ctx.stroke();

  // belly
  ctx.fillStyle='#dff3a0';ctx.beginPath();ctx.ellipse(0,10,15,11,0,0,Math.PI*2);ctx.fill();

  // eyes
  ctx.fillStyle='#79d14c';ctx.beginPath();ctx.arc(-15,-13,12,0,Math.PI*2);ctx.arc(15,-13,12,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-15,-14,7,0,Math.PI*2);ctx.arc(15,-14,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#142117';ctx.beginPath();ctx.arc(-13,-14,3.5,0,Math.PI*2);ctx.arc(17,-14,3.5,0,Math.PI*2);ctx.fill();

  // smile and cheek spots
  ctx.strokeStyle='#244a26';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,5,13,0,Math.PI);ctx.stroke();
  ctx.fillStyle='#4c9e36';ctx.beginPath();ctx.arc(-19,1,3,0,Math.PI*2);ctx.arc(19,1,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function spawn(){
  const gap=Math.max(112,154-game.score*1.25);
  const marginTop=Math.max(145,H*.20);
  const marginBottom=Math.min(H*.61,H-180);
  const minCenter=marginTop+gap/2;
  const maxCenter=marginBottom-gap/2;
  const center=maxCenter>minCenter ? minCenter+Math.random()*(maxCenter-minCenter) : H*.45;
  game.pipes.push({x:W+70,w:68,g:center,gap,scored:false});
}

function draw(){
  bg();
  if(!game)return;
  for(const p of game.pipes){
    snake(p.x,p.g-p.gap/2-310,310,true);
    snake(p.x,p.g+p.gap/2-14,310,false);
  }
  frog();
}

function loop(t){
  const dt=Math.min((t-last)/16.67,2);last=t;
  if(game?.run){
    game.time+=dt;
    game.f.vy+=.47*dt;
    game.f.y+=game.f.vy*dt;
    game.f.rot=clamp(game.f.rot+.038*dt,-.42,.95);
    game.speed=Math.min(6.5,3.75+game.score*.04);

    if(game.pipes.length===0 || game.pipes.at(-1).x<W-255)spawn();

    for(const p of game.pipes){
      p.x-=game.speed*dt;
      if(!p.scored && p.x+p.w<game.f.x){p.scored=true;game.score++;scoreEl.textContent=game.score}

      // forgiving, character-sized hitbox
      const fx=12,fy=14;
      const hitX=game.f.x+fx>p.x && game.f.x-fx<p.x+p.w;
      const hitY=game.f.y-fy<p.g-p.gap/2 || game.f.y+fy>p.g+p.gap/2;
      if(hitX&&hitY){over();break}
    }
    game.pipes=game.pipes.filter(p=>p.x>-120);
    if(game.f.y<18 || game.f.y>H*.69-4)over();
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
