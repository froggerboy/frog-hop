<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Frog Hop</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17132d;font-family:Arial,sans-serif}
body{touch-action:manipulation}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(game) game.f.y=Math.min(game.f.y,H*.72);
}
addEventListener("resize",resize);

let best=Number(localStorage.getItem("frogHopBest")||0);
let game=null, raf=0;

function reset(){
  game={
    mode:"menu",score:0,speed:3.1,spawn:0,
    f:{x:W*.22,y:H*.48,vy:0,r:18},
    pipes:[]
  };
}
function jump(){
  if(!game)return;
  if(game.mode==="menu"||game.mode==="over"){
    reset(); game.mode="play"; game.f.vy=-8.2; return;
  }
  if(game.mode==="play") game.f.vy=-8.2;
}
function addObstacle(){
  const gap=Math.max(128,168-game.score*1.25);
  const minY=125, maxY=Math.max(minY+20,H-185-gap);
  const g=minY+Math.random()*Math.max(20,maxY-minY);
  game.pipes.push({x:W+70,w:76,g,gap,passed:false});
}
function over(){
  if(game.mode!=="play")return;
  game.mode="over";
  best=Math.max(best,game.score);
  localStorage.setItem("frogHopBest",best);
}
function collide(p){
  const fx=game.f.x, fy=game.f.y, r=13;
  const withinX=fx+r>p.x && fx-r<p.x+p.w;
  const withinY=fy-r<p.g || fy+r>p.g+p.gap;
  return withinX&&withinY;
}

function bg(){
  if(!game)return;
  const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,"#17172f"); grd.addColorStop(.48,"#5b3c70"); grd.addColorStop(1,"#d77d88");
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  // moon
  ctx.save();
  ctx.shadowBlur=35;ctx.shadowColor="#ffe7a0";ctx.fillStyle="#ffe39a";
  ctx.beginPath();ctx.arc(W*.78,H*.20,55,0,Math.PI*2);ctx.fill();ctx.restore();
  // distant hills
  ctx.fillStyle="#263f49";
  ctx.beginPath();ctx.moveTo(0,H*.62);
  for(let x=0;x<=W+80;x+=80){
    ctx.quadraticCurveTo(x+40,H*.52,x+80,H*.62);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  // water
  ctx.fillStyle="#163742";ctx.fillRect(0,H*.78,W,H*.22);
  ctx.strokeStyle="rgba(255,255,255,.10)";ctx.lineWidth=2;
  for(let y=H*.82;y<H;y+=30){
    ctx.beginPath();
    for(let x=0;x<W;x+=70){
      ctx.moveTo(x,y);ctx.quadraticCurveTo(x+18,y-3,x+36,y);
    }
    ctx.stroke();
  }
  // reeds
  ctx.strokeStyle="#17352f";ctx.lineWidth=5;
  for(let x=20;x<W;x+=55){
    ctx.beginPath();ctx.moveTo(x,H*.79);ctx.quadraticCurveTo(x-5,H*.70,x+4,H*.66);ctx.stroke();
  }
}
function roundedRect(x,y,w,h,r){
  const q=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+q,y);ctx.arcTo(x+w,y,x+w,y+h,q);ctx.arcTo(x+w,y+h,x,y+h,q);
  ctx.arcTo(x,y+h,x,y,q);ctx.arcTo(x,y,x+w,y,q);ctx.closePath();
}
function frog(){
  const f=game.f,x=f.x,y=f.y;
  ctx.save();ctx.translate(x,y);
  const bob=Math.sin(performance.now()/90)*1.5;
  ctx.translate(0,bob);
  // legs
  ctx.strokeStyle="#68bd4b";ctx.lineWidth=9;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-8,10);ctx.lineTo(-23,23);ctx.moveTo(8,10);ctx.lineTo(23,23);ctx.stroke();
  // body
  let g=ctx.createRadialGradient(-5,-8,3,0,0,28);
  g.addColorStop(0,"#b8ef62");g.addColorStop(1,"#398d43");
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,5,23,19,0,0,Math.PI*2);ctx.fill();
  // head
  ctx.fillStyle="#68bd4b";ctx.beginPath();ctx.ellipse(0,-8,25,21,0,0,Math.PI*2);ctx.fill();
  // eyes
  for(const ex of [-12,12]){
    ctx.fillStyle="#91d95b";ctx.beginPath();ctx.arc(ex,-23,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ex,-24,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#17202a";ctx.beginPath();ctx.arc(ex+1,-24,2.7,0,Math.PI*2);ctx.fill();
  }
  ctx.strokeStyle="#193b2c";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-3,11,.15,Math.PI-.15);ctx.stroke();
  ctx.restore();
}
function snakeBody(x,y,w,h,top){
  let g=ctx.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,"#244f3c");g.addColorStop(.5,"#4e9a4c");g.addColorStop(1,"#1f4635");
  ctx.fillStyle=g;roundedRect(x,y,w,h,18);ctx.fill();
  ctx.strokeStyle="#153426";ctx.lineWidth=3;ctx.stroke();
  // scales
  ctx.strokeStyle="rgba(190,235,115,.28)";ctx.lineWidth=2;
  for(let yy=y+18;yy<y+h-8;yy+=18){
    for(let xx=x+10;xx<x+w-5;xx+=20){
      ctx.beginPath();ctx.arc(xx,yy,6,0,Math.PI);ctx.stroke();
    }
  }
  // eyes and tongue on inner end
  const ey=top?y+h-18:y+18;
  ctx.fillStyle="#f6e85c";
  ctx.beginPath();ctx.arc(x+18,ey-3,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#111";ctx.beginPath();ctx.arc(x+20,ey-3,2,0,Math.PI*2);ctx.fill();
}
function snakes(){
  for(const p of game.pipes){
    const topH=p.g, botY=p.g+p.gap;
    snakeBody(p.x,0,p.w,topH,true);
    snakeBody(p.x,botY,p.w,H-botY,false);
    // heads protrude into gap
    ctx.fillStyle="#4e9a4c";
    ctx.beginPath();ctx.arc(p.x+p.w/2,p.g,27,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(p.x+p.w/2,p.g+p.gap,27,0,Math.PI*2);ctx.fill();
  }
}
function hud(){
  ctx.fillStyle="rgba(20,18,42,.72)";
  roundedRect(24,18,132,58,18);ctx.fill();
  roundedRect(W-156,18,132,58,18);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.28)";ctx.lineWidth=2;
  roundedRect(24,18,132,58,18);ctx.stroke();
  roundedRect(W-156,18,132,58,18);ctx.stroke();
  ctx.fillStyle="#fff";ctx.font="bold 25px Arial";ctx.textAlign="center";
  ctx.fillText("🏆 "+game.score,90,55);
  ctx.fillText("🐸 "+best,W-90,55);
  ctx.font="bold 22px Arial";ctx.letterSpacing="5px";
  ctx.fillText("F R O G  H O P",W/2,55);
}
function panel(title,sub,button){
  ctx.fillStyle="rgba(17,22,35,.82)";
  roundedRect(W/2-150,H*.43-90,300,180,24);ctx.fill();
  ctx.strokeStyle="rgba(255,220,120,.7)";ctx.lineWidth=2;
  roundedRect(W/2-150,H*.43-90,300,180,24);ctx.stroke();
  ctx.textAlign="center";ctx.fillStyle="#c9f36a";ctx.font="900 28px Arial";ctx.fillText(title,W/2,H*.43-38);
  ctx.fillStyle="#fff";ctx.font="14px Arial";ctx.fillText(sub,W/2,H*.43-8);
  ctx.fillStyle="#73bd45";roundedRect(W/2-65,H*.43+22,130,48,16);ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold 18px Arial";ctx.fillText(button,W/2,H*.43+53);
}
function loop(t){
  bg();
  if(!game){reset();}
  if(game.mode==="play"){
    game.f.vy+=.42;game.f.y+=game.f.vy;
    game.spawn--;
    if(game.spawn<=0){addObstacle();game.spawn=105;}
    for(const p of game.pipes)p.x-=game.speed;
    for(const p of game.pipes){
      if(!p.passed&&p.x+p.w<game.f.x){p.passed=true;game.score++;game.speed=Math.min(5.8,3.1+game.score*.045);}
      if(collide(p))over();
    }
    game.pipes=game.pipes.filter(p=>p.x+p.w>-30);
    if(game.f.y-game.f.r<78||game.f.y+game.f.r>H*.79)over();
  }
  snakes();frog();hud();
  if(game.mode==="menu")panel("FROG HOP","Tap to jump • dodge the snakes","PLAY");
  if(game.mode==="over")panel("GAME OVER","Score: "+game.score+" • Best: "+best,"PLAY AGAIN");
  raf=requestAnimationFrame(loop);
}
canvas.addEventListener("pointerdown",e=>{e.preventDefault();jump()},{passive:false});
addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp")jump()});
resize();reset();requestAnimationFrame(loop);
</script>
</body>
</html>
